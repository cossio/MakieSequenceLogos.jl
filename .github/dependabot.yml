version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all-deps:
        patterns:
          - "*"

  - package-ecosystem: "julia" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups: # uncomment to group all julia package updates into a single PR
      all-julia-packages:
        patterns:
          - "*"
    ignore:
      # This package is developed here and shared across the workspace projects
      # (test/, docs/, repl/). A compat bound pinning it to a released version
      # conflicts with the in-development version in the root Project.toml and
      # breaks resolution.
      - dependency-name: "MakieSequenceLogos"
